name: PR gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Run static checks
        shell: bash
        run: |
          mkdir -p artifacts/static
          set +e
          npm run lint 2>&1 | tee artifacts/static/lint.log
          lint_exit=${PIPESTATUS[0]}
          npm run typecheck 2>&1 | tee artifacts/static/typecheck.log
          typecheck_exit=${PIPESTATUS[0]}
          set -e
          if [ "$lint_exit" -eq 0 ] && [ "$typecheck_exit" -eq 0 ]; then status=success; else status=failure; fi
          node scripts/ci/write-job-summary.mjs --job static --status "$status" --executed 2 --skipped 0 --artifact static/lint.log --artifact static/typecheck.log --output artifacts/static-summary.json
          if [ "$status" != success ]; then exit 1; fi
      - name: Upload static diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-diagnostics
          if-no-files-found: warn
          path: |
            artifacts/static/
            artifacts/static-summary.json

  unit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Run unit contract suite
        shell: bash
        run: |
          mkdir -p artifacts/unit-contract coverage
          set +e
          npm test -- --coverage --reporter=json --reporter=junit --outputFile.json=artifacts/unit-contract/vitest.json --outputFile.junit=artifacts/unit-contract/vitest.junit.xml 2>&1 | tee artifacts/unit-contract/vitest.log
          vitest_exit=${PIPESTATUS[0]}
          set -e
          set +e
          node scripts/ci/classify-vitest.mjs --report artifacts/unit-contract/vitest.json --manifest ci/pr-gate-manifest.json --exit-code "$vitest_exit" --output artifacts/unit-contract-summary.json
          classifier_exit=$?
          set -e
          exit "$classifier_exit"
        env:
          CI: 'true'
      - name: Upload unit-contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-contract-diagnostics
          if-no-files-found: warn
          path: |
            artifacts/unit-contract/
            artifacts/unit-contract-summary.json
            coverage/

  integration:
    runs-on: ubuntu-latest
    # 30, matching e2e-accessibility rather than unit-contract's 20: this job is the
    # other network/external-process-bound one in the gate (branch create, 37 real
    # migrations, sequential real-Postgres round-trips, branch teardown) — unlike
    # unit-contract's mocked, in-memory suite, which has no comparable I/O.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Install neonctl
        run: npm i -g neonctl
      - name: Run integration suite
        shell: bash
        run: |
          mkdir -p artifacts/integration
          set +e
          REQUIRE_INTEGRATION_TESTS=1 npx vitest run --config vitest.integration.config.ts --reporter=json --reporter=junit --outputFile.json=artifacts/integration/vitest.json --outputFile.junit=artifacts/integration/vitest.junit.xml 2>&1 | node scripts/redact.mjs | tee artifacts/integration/vitest.log
          vitest_exit=${PIPESTATUS[0]}
          set -e
          # vitest's json/junit reporters write straight to disk, bypassing the piped
          # stdout above — redact those in place too. This is the only job in the gate
          # that touches a real Neon connection string; @neondatabase/serverless echoes
          # the full URL, password included, in its own error messages (see CLAUDE.md's
          # Secrets Hygiene section), and this repo is public.
          for report in artifacts/integration/vitest.json artifacts/integration/vitest.junit.xml; do
            if [ -f "$report" ]; then
              node scripts/redact.mjs < "$report" > "$report.redacted" && mv "$report.redacted" "$report"
            fi
          done
          if [ "$vitest_exit" -eq 0 ]; then status=success; else status=failure; fi
          node scripts/ci/write-job-summary.mjs --job integration --status "$status" --executed 1 --skipped 0 --artifact integration/vitest.log --output artifacts/integration-summary.json
          exit "$vitest_exit"
        env:
          CI: 'true'
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-diagnostics
          if-no-files-found: warn
          path: |
            artifacts/integration/
            artifacts/integration-summary.json

  e2e-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E and accessibility suite
        shell: bash
        run: |
          mkdir -p artifacts/e2e-accessibility
          set +e
          # Keep the full desktop/mobile/a11y matrix within the job budget.
          # Two workers share the fixture server; list output identifies slow tests.
          npm run e2e -- --workers=2 --reporter=list,html,json,junit 2>&1 | tee artifacts/e2e-accessibility/playwright.log
          e2e_exit=${PIPESTATUS[0]}
          set -e
          set +e
          node scripts/ci/classify-playwright.mjs --report "$PLAYWRIGHT_JSON_OUTPUT_NAME" --exit-code "$e2e_exit" --artifact e2e-accessibility/playwright.log --artifact e2e-accessibility/playwright-results.json --artifact e2e-accessibility/playwright.junit.xml --output artifacts/e2e-accessibility-summary.json
          classifier_exit=$?
          set -e
          exit "$classifier_exit"
        env:
          CI: 'true'
          E2E_FIXTURE_MODE: 1
          START_DEV_SERVER: 1
          BASE_URL: http://127.0.0.1:3000
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/fixture
          NEON_AUTH_BASE_URL: https://fixture.invalid
          NEON_AUTH_COOKIE_SECRET: fixture-neon-auth-cookie-secret-for-ci-only-00000001
          NEXT_PUBLIC_SUPABASE_URL: https://fixture.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-anon-key
          SUPABASE_SERVICE_ROLE_KEY: fixture-service-key
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          REPORT_SHARE_SECRET: fixture-report-share-secret-for-ci-only-00000001
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/e2e-accessibility/playwright-results.json
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: artifacts/e2e-accessibility/playwright.junit.xml
      - name: Upload e2e-accessibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-accessibility-diagnostics
          if-no-files-found: warn
          path: |
            artifacts/e2e-accessibility/
            artifacts/e2e-accessibility-summary.json
            playwright-report/
            test-results/

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Build fixture application
        shell: bash
        run: |
          mkdir -p artifacts/build
          set +e
          npm run build 2>&1 | tee artifacts/build/build.log
          build_exit=${PIPESTATUS[0]}
          set -e
          if [ "$build_exit" -eq 0 ]; then status=success; else status=failure; fi
          node scripts/ci/write-job-summary.mjs --job build --status "$status" --executed 1 --skipped 0 --artifact build/build.log --output artifacts/build-summary.json
          exit "$build_exit"
        env:
          CI: 'true'
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/fixture
          NEXT_PUBLIC_SUPABASE_URL: https://fixture.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-anon-key
          SUPABASE_SERVICE_ROLE_KEY: fixture-service-key
          NEON_AUTH_BASE_URL: https://fixture.invalid
          NEON_AUTH_COOKIE_SECRET: fixture-neon-auth-cookie-secret-for-ci-only-00000001
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          if-no-files-found: warn
          path: |
            artifacts/build/
            artifacts/build-summary.json

  cloudflare-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: cloudflare/cron-worker/package-lock.json
      - name: Install and run Worker checks
        shell: bash
        run: |
          mkdir -p artifacts/cloudflare-worker
          set +e
          (cd cloudflare/cron-worker && npm ci && npm test && npm run typecheck) 2>&1 | tee artifacts/cloudflare-worker/output.log
          worker_exit=${PIPESTATUS[0]}
          set -e
          if [ "$worker_exit" -eq 0 ]; then status=success; else status=failure; fi
          node scripts/ci/write-job-summary.mjs --job cloudflare-worker --status "$status" --executed 1 --skipped 0 --artifact cloudflare-worker/output.log --output artifacts/cloudflare-worker-summary.json
          exit "$worker_exit"
      - name: Upload cloudflare-worker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker-diagnostics
          if-no-files-found: warn
          path: |
            artifacts/cloudflare-worker/
            artifacts/cloudflare-worker-summary.json

  pr-gate:
    if: ${{ always() }}
    needs: [static, unit-contract, integration, e2e-accessibility, build, cloudflare-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Download job summaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-diagnostics'
          merge-multiple: true
      - name: Aggregate gate evidence
        run: node scripts/ci/aggregate-gate.mjs
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_CONTRACT_RESULT: ${{ needs.unit-contract.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          E2E_ACCESSIBILITY_RESULT: ${{ needs.e2e-accessibility.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CLOUDFLARE_WORKER_RESULT: ${{ needs.cloudflare-worker.result }}
      - name: Upload PR gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gate-diagnostics
          if-no-files-found: warn
          path: artifacts/gate-summary.json
