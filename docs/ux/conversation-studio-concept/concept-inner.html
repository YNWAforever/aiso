<script>(() => {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia("(prefers-color-scheme: dark)");
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    "codex-visualization-widget-state",
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? "{}");
  initialStateElement?.remove();
  /** @type {Record<string, unknown> | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? "none";
  let nextStateRequestId = 0;
  /** @type {Map<number, { resolve: () => void; reject: (error: Error) => void; timeout: ReturnType<typeof globalThis.setTimeout>; serializedState: string }>} */
  const pendingStateWrites = new Map();
  const persistenceError = () =>
    Object.assign(
      new Error("The host could not persist the widget state update"),
      {
        code: -32000,
        data: { code: "widget_state_persistence_failed", retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) => {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, "data");
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, "ports");
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, "source");
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) => {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) => {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost("open-external", { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) => {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost("follow-up", { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record<string, unknown> | ((previous: Record<string, unknown> | null) => Record<string, unknown>)} next
   * @returns {Promise<void>}
   */
  const setWidgetState = async (next) => {
    const nextState = typeof next === "function" ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== "object" ||
      isArray(nextState)
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) => {
        if (
          typeof value === "undefined" ||
          typeof value === "function" ||
          typeof value === "symbol" ||
          (typeof value === "number" && !Number.isFinite(value))
        ) {
          throw new TypeError("Widget state must be a JSON object");
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== "object" ||
      isArray(parsedState)
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    if (
      hasOwn(storedState, "imageIds") &&
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) => typeof id !== "string",
        ))
    ) {
      throw new TypeError("Widget state imageIds must be an array of strings");
    }
    if (storedState.imageIds?.length > 0) {
      throw Object.assign(
        new TypeError("Visualization state does not support image attachments"),
        { code: -32602, data: { code: "images_unsupported" } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent("openai:set_globals", {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === "none") {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) => {
      const timeout = globalThis.setTimeout(() => {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost("widget-state-write", { id, state: serializedState });
    });
  };
  const syncTheme = () => {
    const theme = mediaQuery.matches ? "dark" : "light";
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: "none",
    };
    globalThis.dispatchEvent(
      new CustomEvent("openai:set_globals", {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () => {
    postToHost("height", {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    "message",
    (event) => {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== "object" ||
        data?.type !== "codex-visualization-initialize" ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          "message",
          (event) => {
            const data = apply(getMessageData, event, []);
            if (typeof data === "object" && data?.type === "measure") {
              sendHeight();
            } else if (
              typeof data === "object" &&
              data?.type === "widget-state-result"
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== "number") {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost("widget-state-write", { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener("change", syncTheme);
  globalThis.addEventListener("click", (event) => {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest("a[href]");
    const href = link?.getAttribute("href");
    if (href == null) {
      return;
    }
    if (href.startsWith("#")) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost("scroll-to", {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
</script>

<script>
(() => {
  // Host colors are defaults; later authored styles can give the same names
  // their own meaning (for example, --muted as a chart's label color).
  const hostStyles = document.getElementById("codex-visualization-host-theme");
  const hostStyle = hostStyles.sheet.cssRules[0].style;
  // Typography, geometry and interaction cursors still follow the host.
  const styleForProperty = (property) =>
    /^--(?:font-|radius|corner-shape$|control-spacing$|cursor-interaction$|icon-size$|visualize-paint-gutter$)/.test(property)
      ? document.documentElement.style
      : hostStyle;
  const initialGlobals =
    globalThis.__codexVisualizationInitialGlobals ?? globalThis.openai;
  delete globalThis.__codexVisualizationInitialGlobals;
  if (initialGlobals?.statePersistence != null) {
    globalThis.openai ??= {};
    globalThis.openai.statePersistence = initialGlobals.statePersistence;
    globalThis.openai.stateModelContext = initialGlobals.stateModelContext ?? "none";
  }
  if (!true) {
    return;
  }
  let appliedProperties = [];
  const applyHostStyleVariables = (styleVariables) => {
    if (styleVariables == null || typeof styleVariables !== "object") {
      return;
    }
    for (const property of appliedProperties) {
      styleForProperty(property).removeProperty(property);
    }
    appliedProperties = [];
    for (const [property, value] of Object.entries(styleVariables)) {
      if (property.startsWith("--") && typeof value === "string") {
        styleForProperty(property).setProperty(property, value);
        appliedProperties.push(property);
      }
    }
  };

  const syncHostStyles = (globals) => {
    applyHostStyleVariables(globals?.visualizationStyleVariables);
    const sandboxDocument = globalThis.frameElement?.ownerDocument;
    if (sandboxDocument != null && globals?.visualizationTheme != null) {
      let colorSchemeMeta = sandboxDocument.querySelector(
        'meta[name="color-scheme"]',
      );
      if (colorSchemeMeta == null) {
        colorSchemeMeta = sandboxDocument.createElement("meta");
        colorSchemeMeta.name = "color-scheme";
        sandboxDocument.head.appendChild(colorSchemeMeta);
      }
      colorSchemeMeta.content = globals.visualizationTheme;
      sandboxDocument.documentElement.style.colorScheme =
        globals.visualizationTheme;
      // Paint the host surface behind transparent saved visualization documents.
      sandboxDocument.documentElement.style.backgroundColor =
        hostStyle.getPropertyValue("--background");
    }
  };

  syncHostStyles(initialGlobals);
  globalThis.addEventListener("openai:set_globals", (event) => {
    syncHostStyles(event.detail?.globals);
  });
})();
</script>

<script>
(function(){
  const root=document.getElementById('aiso-studio');
  const main=root.querySelector('#as-main');
  const brandSelect=root.querySelector('#as-brand');
  const templates=[
    {id:'opportunity',category:'discover',icon:'search',title:'找出香港內容機會',description:'找出未答好的購買問題，決定先改哪幾頁。',output:'機會清單 → 內容 brief',prompt:'針對香港想買空氣清新機的人，我們有甚麼問題未答好？應該先改哪幾頁？'},
    {id:'improve',category:'improve',icon:'file-pen-line',title:'改善一個現有頁面',description:'由頁面和證據開始，整理可以交付的修改建議。',output:'修改清單 → 工作項目',prompt:'幫我檢查產品比較頁，有甚麼內容需要補充？'},
    {id:'brief',category:'improve',icon:'notebook-pen',title:'建立有來源的 brief',description:'結合品牌文件、內容缺口及真實來源。',output:'brief → 待審版本',prompt:'請根據產品資料與已核准事實，建立香港小型住宅選購指南 brief。'},
    {id:'competitors',category:'discover',icon:'scan-search',title:'比較競爭對手的內容',description:'看他們回答了甚麼，保留頁面與引用證據。',output:'內容差距 → 機會',prompt:'比較我們和競爭對手對小型住宅空氣清新機的回答。'},
    {id:'monitor',category:'monitor',icon:'activity',title:'解釋本週能見度變化',description:'查看已保存的觀察、引用及未完成的測試。',output:'觀察解讀 → 下一步',prompt:'根據已保存的 Pulse 觀察，本週有甚麼改變？'},
    {id:'report',category:'report',icon:'file-chart-column',title:'整理客戶報告',description:'將研究、修改及結果整理成可審閱的版本。',output:'報告草稿 → 審閱',prompt:'把本月內容工作整理成一份有來源的客戶報告草稿。'}
  ];
  const toolsList=[['品牌概覽','home','優先事項、執行進度'],['網站掃描','scan','檢查與掃描紀錄'],['掃描結果','results','結果、證據與歷史'],['改善建議','improve','內容工具與修正'],['Pulse 監測','monitor','平台觀察與變化'],['Local Trust／ROI','roi','本地信任與效益'],['品牌實體','entities','品牌事實與身份'],['內容機會','opportunities','機會與工作項目'],['觀察紀錄','observations','原始問題與回應'],['核准來源','sources','來源與版本'],['問題庫','prompts','監測問題設定'],['競爭對手','competitors','對手與基準'],['引用來源','citations','可追溯引用'],['客戶報告','reports','版本、預覽與發佈'],['帳戶設定','settings','方案、成員與通知'],['管理工具','admin','維持現有角色權限']];
  const state={view:'home',brand:'home',category:'all',active:'gap',panel:null,attached:false,saved:false,note:'',selectedTemplate:'opportunity',draft:'',threads:[{id:'gap',brand:'home',title:'香港購買問題缺口',kind:'opportunity',status:'待選下一步',question:templates[0].prompt},{id:'faq',brand:'home',title:'比較頁內容 brief',kind:'brief',status:'草稿待審',question:templates[2].prompt},{id:'pulse',brand:'home',title:'十月能見度檢討',kind:'monitor',status:'有待補觀察',question:templates[4].prompt}]};
  const design={evidenceByDefault:false,compactTemplates:false};
  const brandStates={home:{attached:false,saved:false,draft:'',savedThreadId:null},tea:{attached:false,saved:false,draft:'',savedThreadId:null}};
  const followDrafts={};
  function esc(value){return String(value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
  function icon(name){return '<i data-lucide="'+name+'" aria-hidden="true" class="as-icon"></i>';}
  function button(label,action,primary){return '<button type="button" class="as-btn cursor-interaction'+(primary?' primary':'')+'" data-action="'+action+'">'+label+'</button>';}
  function badge(text,kind){return '<span class="as-badge '+(kind||'')+'">'+text+'</span>';}
  function brand(){return state.brand==='home'?'Harbour Home':'Harbour Tea';}
  function remember(){if(window.openai&&window.openai.setWidgetState)window.openai.setWidgetState({modelContent:{concept:'AISO conversation studio',view:state.view,brand:brand(),briefSavedInDemo:state.saved},privateContent:{view:state.view,brand:state.brand,category:state.category,saved:state.saved,attached:state.attached}}).catch(function(){});}
  function applySaved(saved){const p=saved&&saved.privateContent;if(!p)return;if(['home','tea'].includes(p.brand))state.brand=p.brand;if(['home','threads','documents','connections','tools'].includes(p.view))state.view=p.view;if(typeof p.saved==='boolean')state.saved=p.saved;if(typeof p.attached==='boolean')state.attached=p.attached;}
  function composer(id,placeholder){return '<div class="as-composer"><label class="as-label" for="'+id+'">'+(id==='as-prompt'?'你的工作目標':'繼續這個討論')+'</label><textarea id="'+id+'" placeholder="'+placeholder+'">'+(id==='as-prompt'?esc(state.draft):'')+'</textarea><div class="as-composerfooter"><div class="as-row">'+button(icon('paperclip')+'選文件','attach')+badge('香港 · 繁中')+'</div>'+button(icon('arrow-up')+(id==='as-prompt'?'開始討論':'送出示例'),id==='as-prompt'?'start':'follow',true)+'</div>'+(state.attached?'<div class="as-attached">'+badge('產品資料 v3 · 已選用','blue')+'</div>':'')+'</div>';}
  function home(){
    const shown=templates.filter(function(t){return state.category==='all'||t.category===state.category;});
    return '<section class="as-homehero"><div class="as-eyebrow">YOUR BRAND WORKSPACE</div><h1>今日想為品牌完成甚麼？</h1><p>直接問，或選一個範本。把研究變成下一份有來源、可以交付的成果。</p></section>'+composer('as-prompt','例如：香港客人買這類產品前，還有哪些問題未被回答？')+'<div class="as-sourcebar"><span><span class="as-dot"></span>AISO 已保存資料</span><span>Search Console · 示例已綁定</span><button class="as-plain cursor-interaction" type="button" data-view="connections">管理資料連接 '+icon('arrow-right')+'</button></div><div class="as-between"><h3>從一個任務開始</h3><span class="as-small as-muted">每個範本都有明確成果</span></div><div class="as-row" style="margin-top:12px">'+[['all','全部'],['discover','發現機會'],['improve','改善內容'],['monitor','觀察成效'],['report','交付報告']].map(function(c){return '<button type="button" class="as-filter cursor-interaction" data-filter="'+c[0]+'" aria-pressed="'+(state.category===c[0])+'">'+c[1]+'</button>';}).join('')+'</div><div class="as-templates">'+shown.map(function(t){return '<button type="button" class="as-template cursor-interaction" data-template="'+t.id+'"><div class="as-row">'+icon(t.icon)+'<strong>'+t.title+'</strong></div>'+(!design.compactTemplates?'<p>'+t.description+'</p>':'')+'<small>'+t.output+'</small></button>';}).join('')+'</div><section class="as-recent"><div class="as-between"><h3>繼續工作</h3><button type="button" class="as-plain cursor-interaction" data-view="threads">所有討論 '+icon('arrow-right')+'</button></div>'+threadRows()+'</section>';
  }
  function threadRows(){const ts=state.threads.filter(function(t){return t.brand===state.brand;});return ts.length?ts.map(function(t){return '<button class="as-recentrow cursor-interaction" type="button" data-thread="'+t.id+'"><div>'+esc(t.title)+'<span>私人 · '+t.status+'</span></div>'+icon('arrow-up-right')+'</button>';}).join(''):'<p class="as-small as-muted" style="padding:18px 0">這個品牌未有討論。從上方的工作目標開始。</p>';}
  function threads(){return '<div class="as-threadheader"><div class="as-eyebrow">DISCUSSIONS</div><h1>每件工作，各有脈絡</h1><p class="as-muted as-small" style="margin-top:10px">討論只屬於目前品牌。核准成果可另行分享。</p></div>'+threadRows()+ '<div style="margin-top:20px">'+button('開始新討論','new',true)+'</div>';}
  function opportunity(){return '<p>建議先把問題收斂到「香港小型住宅」的選購情境。以下用示例展示如何由證據走到修改建議。</p><details class="as-run"><summary>研究步驟 · 示例流程</summary><ol><li>讀取已選品牌文件與頁面</li><li>檢查 Search Console 的 property、地區與期間</li><li>核實搜尋端點的香港／語言支援</li><li>比較公開頁面的實際回答並保留來源</li></ol></details><article class="as-result"><div class="as-kicker">優先改善現頁 · 示例</div><h3>小型住宅應怎樣選擇空氣清新機？</h3><p class="as-small as-muted" style="margin-top:7px">比較頁可以補充使用面積、噪音與濾芯成本，幫助用戶完成購買判斷。</p><div class="as-row">'+badge('現有頁：/compare')+badge('搜尋需求：待核實','amber')+'</div><div class="as-row as-actions">'+button('查看證據','evidence')+button('另開 brief 討論','branch',true)+'</div></article><article class="as-result"><div class="as-kicker">候選新內容 · 示例</div><h3>更換濾芯的成本與保養週期</h3><p class="as-small as-muted" style="margin-top:7px">先核對產品文件中的費用和保養事實，再決定新增 FAQ 或獨立指南。</p></article><div class="as-note">HK／繁中：DataForSEO 的 ChatGPT LLM Mentions 目前只標示美國／英文覆蓋，此處不顯示香港 ChatGPT 分數。</div>';}
  function brief(){const saved=state.saved&&(state.savedThreadId||'faq')===state.active;return '<p>這份 brief 引用目前選定的品牌資料版本，並連回「香港購買問題缺口」的討論。</p><article class="as-result"><div class="as-between"><span class="as-kicker">CONTENT BRIEF</span>'+badge(saved?'已保存 · 示例':'待審草稿','blue')+'</div><h3>香港小型住宅選購指南</h3><div class="as-evidence"><details open><summary>目標與內容結構</summary><p>目標：回答選購疑慮，連到產品比較頁。<br>章節：使用情境 → 面積與性能 → 噪音 → 濾芯成本 → 比較與下一步。</p></details><details><summary>文件與證據</summary><p>產品資料 v3；品牌語調 v2；核准事實來源。搜尋量及頁面成效尚待真實資料驗證。</p></details><details><summary>驗證與跟進</summary><p>核對產品聲稱；保留修改版本與發佈日期，再觀察同一範圍的查詢及頁面成效。</p></details></div><div class="as-row as-actions">'+button(saved?'查看已保存成果':'保存為工作項目草稿',saved?'documents':'save',true)+button('來源詳情','evidence')+'</div></article><p class="as-small as-muted">保存後可在「文件與成果」及原有工作項目版本流程找到。審批與發佈仍各自處理。</p>';}
  function monitor(){return '<p>先分開「已保存觀察」與「尚欠資料」，再解釋變化。</p><article class="as-result"><div class="as-kicker">觀察範圍 · 示例</div><h3>部分平台尚未完成觀察</h3><p class="as-small as-muted" style="margin-top:8px">目前不足以形成完整週比較。不將沒有回應的問題計作零提及，也不以模型自評代替引用證據。</p><div class="as-row as-actions">'+button('查看觀察與來源','evidence')+button('前往 Pulse 工具','tool-monitor',true)+'</div></article>';}
  function otherAnswer(t){const template=templates.find(function(x){return x.id===t.kind;})||templates[0];return '<p>這個範本會把工作整理成「'+template.output+'」。先選定頁面、文件與分析範圍，再查看具來源的草稿。</p><article class="as-result"><h3>'+template.title+'</h3><p class="as-small as-muted" style="margin-top:8px">設計示例：實作後使用既有 AISO 資料與工具，保存到原有工作流程。</p><div class="as-row as-actions">'+button('選擇品牌文件','attach')+button('查看原有工具','tools',true)+'</div></article>';}
  function thread(){const t=state.threads.find(function(x){return x.id===state.active&&x.brand===state.brand;});if(!t){state.view='home';return home();}return '<div class="as-threadheader"><div class="as-between"><div class="as-eyebrow">DISCUSSION / '+(t.kind==='brief'?'CONTENT BRIEF':'RESEARCH')+'</div>'+badge('私人討論')+'</div><h2>'+esc(t.title)+'</h2><div class="as-row" style="margin-top:10px">'+badge('香港 · 繁中')+badge('期間：最近完整 28 日')+(state.attached?badge('產品資料 v3','blue'):'')+'</div></div><div class="as-layout '+(state.panel?'with-panel':'')+'"><div><div class="as-user">'+esc(t.question)+'</div><div class="as-answer"><div class="as-answer-title">'+icon('sparkles')+'AISO · 示範回答</div>'+(t.kind==='opportunity'?opportunity():t.kind==='brief'?brief():t.kind==='monitor'?monitor():otherAnswer(t))+'</div><div style="margin-top:22px">'+composer('as-follow','繼續追問，或把選定內容另開討論…')+'</div><div class="as-toast" role="status" aria-live="polite">'+esc(state.note)+'</div></div>'+(state.panel?inspector():'')+'</div>';}
  function inspector(){return '<aside class="as-inspector" aria-label="證據詳情"><div class="as-between"><h3>本次證據</h3>'+button('關閉','close-panel')+'</div><p>示例結構；沒有執行外部查詢。</p><dl><div><dt>品牌文件</dt><dd>產品資料 v3<br>已選版本 · 示例核准狀態</dd></div><div><dt>Search Console</dt><dd>所選 property 的香港篩選<br>期間與完整度需回讀</dd></div><div><dt>DataForSEO</dt><dd>SERP／關鍵字端點<br>香港／語言支援待確認</dd></div><div><dt>Firecrawl</dt><dd>公開頁面 URL、擷取時間、引用段落</dd></div><div><dt>AI 引用</dt><dd>保留原問題、平台及測試時間；與搜尋成效分開</dd></div></dl><div class="as-note">缺少資料時顯示「待核實」，不填入推算數字。</div></aside>';}
  function documents(){return '<div class="as-threadheader"><div class="as-eyebrow">DOCUMENTS & OUTPUTS</div><h1>資料與成果，都找得到</h1><p class="as-muted as-small" style="margin-top:10px">輸入資料有版本，交付成果有自己的審閱流程。</p></div><section class="as-sheet"><h3>品牌資料 · 示例</h3><div class="as-docrow">'+icon('file-text')+'<div class="as-docmain">產品資料 v3<p>目前品牌 · 核准版本 · 示例</p></div>'+button(state.attached?'已選用':'加入本次討論','attach')+'</div><div class="as-docrow">'+icon('book-open')+'<div class="as-docmain">品牌語調 v2<p>已保存文件 · 使用時鎖定版本</p></div>'+badge('品牌可用')+'</div></section><section class="as-sheet"><div class="as-between"><h3>工作成果</h3>'+badge(state.saved?'1 份示例成果':'尚未保存')+'</div>'+(state.saved?'<div class="as-docrow">'+icon('notebook-pen')+'<div class="as-docmain">香港小型住宅選購指南<p>工作項目 WI-DEMO-01 · v1 · 草稿</p></div>'+button('開啟成果','open-brief',true)+'</div>':'<p class="as-muted as-small" style="margin-top:14px">在 brief 討論中保存草稿，成果會出現在這裏。</p>')+'</section><div class="as-toast" role="status" aria-live="polite">'+esc(state.note)+'</div>';}
  function connections(){return '<div class="as-threadheader"><div class="as-eyebrow">CONNECTED DATA</div><h1>讓答案有資料依據</h1><p class="as-muted as-small" style="margin-top:10px">每個連接都有範圍、擁有人與資料日期。以下為示例狀態。</p></div><div class="as-connections"><article class="as-connection"><div class="as-between"><h3>Google Search Console</h3>'+badge('已綁定 · 示例','blue')+'</div><p>品牌網域 property · 只讀<br>可以分析哪些搜尋問題帶來曝光與點擊。</p><div class="as-row">'+badge('資料完整度需驗證')+button('查看連接範圍','gsc-info')+'</div></article><article class="as-connection"><div class="as-between"><h3>DataForSEO</h3>'+badge('香港端點待核實','amber')+'</div><p>搜尋需求與 SERP 證據。每次工作先列明端點、地區、語言及費用上限。</p>'+button('查看覆蓋限制','coverage')+'</article><article class="as-connection"><div class="as-between"><h3>Firecrawl</h3>'+badge('未連接 · 示例')+'</div><p>擷取公開自家與競爭對手頁面，保留內容、來源及時間。</p>'+button('查看連接方式','firecrawl-info')+'</article></div><section class="as-sheet" id="as-connection-info" '+(state.note?'':'hidden')+' role="status" aria-live="polite">'+esc(state.note)+'</section>';}
  function tools(){return '<div class="as-threadheader"><div class="as-eyebrow">EXISTING WORKSPACE</div><h1>原有功能，繼續直接使用</h1><p class="as-muted as-small" style="margin-top:10px">對話協助開始與解讀；專業操作保留在原有工作畫面。</p></div><div class="as-toolgrid">'+toolsList.map(function(t){return '<button type="button" class="as-tool cursor-interaction" data-tool="'+t[1]+'"><div>'+t[0]+'<small>'+t[2]+'</small></div>'+icon('arrow-up-right')+'</button>';}).join('')+'</div><div class="as-toast" role="status" aria-live="polite">'+esc(state.note)+'</div>';}
  function render(){
    brandSelect.value=state.brand;
    const titles={home:'開始工作',threads:'討論串',thread:'討論',documents:'文件與成果',connections:'資料連接',tools:'全部 AISO 工具'};
    root.querySelector('#as-breadcrumb').textContent=brand()+' / '+titles[state.view];
    root.querySelectorAll('.as-navbutton').forEach(function(b){if(b.dataset.view===state.view||(state.view==='thread'&&b.dataset.view==='threads'))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    root.querySelector('#as-threadnav').innerHTML=state.threads.filter(function(t){return t.brand===state.brand;}).slice(-4).map(function(t){return '<button type="button" class="as-threadnav cursor-interaction '+(state.active===t.id&&state.view==='thread'?'active':'')+'" data-thread="'+t.id+'">'+esc(t.title)+'<span>'+t.status+'</span></button>';}).join('')||'<p class="as-small as-muted" style="padding:10px">這個品牌未有討論</p>';
    main.innerHTML=state.view==='home'?home():state.view==='threads'?threads():state.view==='thread'?thread():state.view==='documents'?documents():state.view==='connections'?connections():tools();
    const follow=main.querySelector('#as-follow');if(follow)follow.value=followDrafts[state.active]||'';
    if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});

<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) => {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest("[data-tooltip]");
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) => {
    lastPointerWasTouch =
      event.type === "pointerdown" && event.pointerType === "touch";
  };
  const handleTouchClick = (event) => {
    const isTouch = event.pointerType === "touch" || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch && activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() => {
      if (activeTrigger === trigger && !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) => {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) => {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) => {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll("*")) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) => {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) => {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host && !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger && !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () => {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>
<script id="codex-visualization-carousel">
  (() => {
    for (const root of document.querySelectorAll(".viz-carousel")) {
      const panels = Array.from(
        root.querySelectorAll(":scope > [data-variant]"),
      );
      if (panels.length === 0) {
        continue;
      }
      root.setAttribute("role", "group");
      panels.forEach((panel, index) => {
        panel.hidden = index !== 0;
        panel.setAttribute("role", "group");
        if (!panel.hasAttribute("aria-label")) {
          panel.setAttribute("aria-label", panel.dataset.variant);
        }
      });
      root.dataset.activeVariant = panels[0].dataset.variant;
      if (panels.length === 1) {
        continue;
      }

      const controls = document.createElement("div");
      controls.className = "viz-carousel-controls";
      // Portable copy of the settings dropdown's legacy glyph; no 14px icon-package preset matches it.
      // https://github.com/openai/openai/blob/master/codex/codex-apps/webview/src/icons/chevron.svg
      controls.innerHTML = `
      <button type="button" class="viz-carousel-previous cursor-interaction"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <details class="viz-carousel-picker">
        <summary class="cursor-interaction">
          <span class="viz-carousel-count tabular-nums"></span>
          <span class="viz-carousel-name"></span>
          <svg class="viz-carousel-caret" width="14" height="14" viewBox="0 0 20 21" fill="none" aria-hidden="true" focusable="false">
            <path d="M15.2793 7.71101C15.539 7.45131 15.961 7.45131 16.2207 7.71101C16.4804 7.97071 16.4804 8.39272 16.2207 8.65242L10.4707 14.4024C10.211 14.6621 9.78902 14.6621 9.52932 14.4024L3.77932 8.65242L3.69436 8.54792C3.52385 8.28979 3.55205 7.93828 3.77932 7.71101C4.00659 7.48374 4.3581 7.45554 4.61623 7.62605L4.72073 7.71101L10 12.9903L15.2793 7.71101Z" fill="currentColor" stroke="currentColor" stroke-width="0.6" />
          </svg>
        </summary>
        <div class="viz-carousel-options"></div>
      </details>
      <button type="button" class="viz-carousel-next cursor-interaction"><i data-lucide="chevron-right" aria-hidden="true"></i></button>`;
      const previous = controls.querySelector(".viz-carousel-previous");
      const next = controls.querySelector(".viz-carousel-next");
      const picker = controls.querySelector(".viz-carousel-picker");
      const summary = picker.querySelector("summary");
      const count = controls.querySelector(".viz-carousel-count");
      const name = controls.querySelector(".viz-carousel-name");
      const options = controls.querySelector(".viz-carousel-options");
      const status = document.createElement("span");
      status.className = "sr-only";
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");
      status.setAttribute("aria-atomic", "true");
      previous.setAttribute(
        "aria-label",
        root.dataset.previousLabel ?? "Previous variant",
      );
      next.setAttribute("aria-label", root.dataset.nextLabel ?? "Next variant");

      let active = 0;
      let mousePointerId = null;
      let summaryPointerHandled = false;
      summary.addEventListener("pointerdown", (event) => {
        summaryPointerHandled =
          event.pointerType === "mouse" && event.button === 0 && !event.ctrlKey;
        if (!summaryPointerHandled) {
          return;
        }
        event.preventDefault();
        summary.focus({ preventScroll: true });
        picker.open = !picker.open;
        mousePointerId = picker.open ? event.pointerId : null;
      });
      summary.addEventListener("click", (event) => {
        if (summaryPointerHandled && event.detail > 0) {
          event.preventDefault();
        }
      });
      const choices = panels.map((panel, index) => {
        const choice = document.createElement("button");
        choice.type = "button";
        choice.className = "cursor-interaction";
        choice.textContent = panel.dataset.variant;
        choice.addEventListener("click", () => {
          select(index);
          summary.focus();
        });
        choice.addEventListener("pointerup", (event) => {
          if (
            picker.open &&
            event.pointerType === "mouse" &&
            event.button === 0 &&
            event.pointerId === mousePointerId
          ) {
            choice.click();
          }
        });
        options.appendChild(choice);
        return choice;
      });
      const select = (index) => {
        const changed = active !== index;
        active = index;
        panels.forEach((panel, position) => {
          panel.hidden = position !== active;
          choices[position].setAttribute(
            "aria-current",
            String(position === active),
          );
        });
        root.dataset.activeVariant = panels[active].dataset.variant;
        count.textContent = `${active + 1} / ${panels.length}`;
        name.textContent = panels[active].dataset.variant;
        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener("click", () =>
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener("click", () =>
        select((active + 1) % panels.length),
      );
      picker.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && picker.open) {
          event.preventDefault();
          picker.open = false;
          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === "ArrowDown") {
          nextIndex = index < 0 ? active : (index + 1) % choices.length;
        } else if (event.key === "ArrowUp") {
          nextIndex = index < 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open && event.key === "Home") {
          nextIndex = 0;
        } else if (picker.open && event.key === "End") {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener("focusout", (event) => {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) => {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () => {
        mousePointerId = null;
      };
      const sizePicker = () => {
        root.style.setProperty(
          "--viz-carousel-picker-height",
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener("toggle", sizePicker);
      window.addEventListener("resize", sizePicker);
      document.addEventListener("pointerdown", dismiss);
      document.addEventListener("pointerup", endPointerSelection);
      document.addEventListener("pointercancel", endPointerSelection);
      window.addEventListener("blur", endPointerSelection);
      window.addEventListener(
        "pagehide",
        () => {
          document.removeEventListener("pointerdown", dismiss);
          document.removeEventListener("pointerup", endPointerSelection);
          document.removeEventListener("pointercancel", endPointerSelection);
          window.removeEventListener("blur", endPointerSelection);
          window.removeEventListener("resize", sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
</script>
<script id="codex-visualization-lucide" async src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
<script>
(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>
